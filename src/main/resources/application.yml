server:
  port: 8080

spring:
  application:
    name: car-damage-ai-pipeline

  datasource:
    url: jdbc:sqlite:car-damage.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect

anthropic:
  # Read from environment variable, never commit a real key.
  api-key: ${ANTHROPIC_API_KEY:}
  base-url: https://api.anthropic.com
  # TODO: verify this identifier against current Anthropic docs
  # (https://docs.claude.com/en/docs/about-claude/models) before the
  # first real run - do not trust this value blindly.
  model: claude-opus-5-5
  max-tokens: 2048

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
