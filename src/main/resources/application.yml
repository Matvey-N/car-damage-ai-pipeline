spring:
  application:
    name: car-damage-ai-pipeline
  servlet:
    multipart:
      max-file-size: 40MB      # per uploaded image (SYNDCAR PNGs reach ~32 MB); downscaled before the API call
      max-request-size: 400MB  # demo scenario: up to 10 images

pipeline:
  # stub      - canned answers, no API key needed (default: development, tests)
  # anthropic - real Claude API calls (needs ANTHROPIC_API_KEY)
  model-client: ${PIPELINE_MODEL_CLIENT:stub}
  max-attempts: 3
  retry-backoff-ms: 1000
  image:
    # Images with a longer side above max-side, or larger than max-bytes, are
    # scaled down and re-encoded as JPEG before being sent (API limit: 5 MB).
    max-side: 1568
    max-bytes: 4500000
  # mode=relook on /api/v1/analyze: second look at the photo with the found damages
  # marked, to find the missed ones (2 model calls per image).
  # mode=tiled on /api/v1/analyze: the image is also analyzed as a grid of
  # overlapping tiles, so small damages are seen at a higher resolution.
  # Costs (rows x cols + 1) model calls per image.
  # Mini App inspections: SQLite database and photo files (the data/ folder is not in Git)
  storage:
    dir: ${STORAGE_DIR:data/app}
    inspections-per-user: 50
  # Simultaneous model calls: photos of an inspection and calls of the tiled mode
  # run in parallel. Lower these if the API answers 429 (rate limit of the account).
  parallelism:
    photos: 3
    tiles: 4
  # Mini App analyses run in the background (the page polls the progress)
  jobs:
    workers: 2        # inspections analyzed at the same time
    queue: 20         # waiting inspections; more are refused with 429
    per-user: 1       # unfinished analyses per user
    keep-minutes: 60  # finished jobs are forgotten after this (the inspections stay)
  tiling:
    rows: 2
    cols: 2
    overlap: 0.2
    include-full-image: true
    merge-iou: 0.5

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  base-url: https://api.anthropic.com
  # Checked against the official models table (platform.claude.com/docs,
  # "Models overview"): Claude Opus 5.5, Claude API ID "claude-opus-5-5".
  # Dateless IDs are pinned snapshots, so results stay reproducible.
  model: claude-opus-5-5
  # Adaptive thinking is always on for this model and counts towards
  # max_tokens, so leave room beyond the short JSON answer.
  max-tokens: 8000
  timeout-seconds: 120

telegram:
  # Demo bot (secondary). Empty = bot is off. Token comes from @BotFather;
  # set it as an environment variable, never write it into this file.
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  # false = do not poll Telegram even with a token (tests, or Mini App backend only)
  polling: true
  miniapp:
    # HTTPS address of the Mini App page, e.g. https://xxxx.trycloudflare.com/miniapp/index.html
    url: ${TELEGRAM_MINIAPP_URL:}
    # protects the API key: model calls per user per hour
    # (a photo costs 1 in quick mode, 2 in careful mode, 5 in detailed mode)
    photos-per-hour: 100
  base-url: https://api.telegram.org
